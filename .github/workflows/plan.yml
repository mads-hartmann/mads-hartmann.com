name: Terraform plan
on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'scripts/check-terraform.sh'
      - 'scripts/plan-stack.sh'
      - 'scripts/deploy-stack.sh'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  plan:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner && vars.TERRAFORM_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler: '4.0.16'
          bundler-cache: true
          working-directory: sites/blog.mads-hartmann.com
      - run: scripts/build.sh
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_SHARED_PLAN }}
          aws-region: eu-central-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Plan shared and read public outputs
        run: |
          terraform -chdir=terraform/stacks/shared init -input=false -lockfile=readonly -backend-config=backend.hcl
          terraform -chdir=terraform/stacks/shared plan -input=false -lock-timeout=5m -no-color
          echo "TF_VAR_zone_id=$(terraform -chdir=terraform/stacks/shared output -raw zone_id)" >> "$GITHUB_ENV"
          echo "TF_VAR_certificate_arn=$(terraform -chdir=terraform/stacks/shared output -raw certificate_arn)" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_HOMEPAGE_PLAN }}
          aws-region: eu-central-1
          unset-current-credentials: true
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: scripts/plan-stack.sh homepage
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_BLOG_PLAN }}
          aws-region: eu-central-1
          unset-current-credentials: true
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: scripts/plan-stack.sh blog
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_USES_PLAN }}
          aws-region: eu-central-1
          unset-current-credentials: true
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: scripts/plan-stack.sh uses
