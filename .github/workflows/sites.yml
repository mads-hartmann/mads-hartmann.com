name: Sites
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to deploy (shared always runs first)
        type: choice
        options: [all, shared, homepage, blog, uses]
        default: all
permissions:
  contents: read
# Queue production changes; newer branch/PR runs can replace unfinished checks.
concurrency:
  group: sites-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      terraform_plan_changed: ${{ steps.changes.outputs.terraform_plan_changed }}
      terraform_changed: ${{ steps.changes.outputs.terraform_changed }}
      homepage_changed: ${{ steps.deployments.outputs.homepage_changed }}
      blog_changed: ${{ steps.deployments.outputs.blog_changed }}
      uses_changed: ${{ steps.deployments.outputs.uses_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Terraform changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          # Manual runs and pushes without a usable base run the full checks.
          changed=true
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$(git merge-base "$PR_BASE" "$PR_HEAD")"
            head="$PR_HEAD"
          elif [ "$EVENT_NAME" = push ] && git cat-file -e "${PUSH_BASE}^{commit}" 2>/dev/null; then
            base="$PUSH_BASE"
            head="$GITHUB_SHA"
          else
            echo "terraform_plan_changed=$changed" >> "$GITHUB_OUTPUT"
            echo "terraform_changed=$changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$base" "$head" -- terraform/ scripts/check-terraform.sh .github/workflows/ .github/actions/; then
            changed=false
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
          fi
          echo "terraform_changed=$changed" >> "$GITHUB_OUTPUT"
          plan_changed=true
          if git diff --quiet "$base" "$head" -- terraform/ scripts/check-terraform.sh scripts/plan-stack.sh scripts/deploy-stack.sh .github/workflows/ .github/actions/; then
            plan_changed=false
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
          fi
          echo "terraform_plan_changed=$plan_changed" >> "$GITHUB_OUTPUT"
      - name: Select site deployments
        id: deployments
        if: >-
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
          vars.TERRAFORM_DEPLOY_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_STACK: ${{ inputs.stack }}
        run: python3 scripts/deployment-changes.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler: '4.0.16'
          bundler-cache: true
          working-directory: sites/blog.mads-hartmann.com
      - run: scripts/build.sh
      - run: node scripts/check-sites.mjs
      - run: scripts/check-workflows.sh
      - run: tar -czf sites.tar.gz .build/homepage .build/blog .build/uses .build/routing
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sites
          path: sites.tar.gz
          retention-days: 7
  terraform:
    name: Validate and test Terraform (${{ matrix.terraform_version }})
    needs: build
    if: needs.build.outputs.terraform_changed == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        terraform_version: ['1.16.4', '1.16.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sites
      - run: tar -xzf sites.tar.gz
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false
      - run: scripts/check-terraform.sh
  checks:
    name: Checks
    if: always()
    needs: [build, terraform]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TERRAFORM_CHANGED: ${{ needs.build.outputs.terraform_changed }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
        run: |
          test "$BUILD_RESULT" = success
          if [ "$TERRAFORM_CHANGED" = false ]; then
            test "$TERRAFORM_RESULT" = skipped
          else
            test "$TERRAFORM_RESULT" = success
          fi
  plan:
    name: Plan
    needs: [build, checks]
    if: >-
      !cancelled() && needs.checks.result == 'success' &&
      needs.build.outputs.terraform_plan_changed == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner && vars.TERRAFORM_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sites
      - run: tar -xzf sites.tar.gz
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_SHARED_PLAN }}
          aws-region: eu-central-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Plan shared and read public outputs
        run: |
          terraform -chdir=terraform/stacks/shared init -input=false -lockfile=readonly -backend-config=backend.hcl
          terraform -chdir=terraform/stacks/shared plan -input=false -lock-timeout=5m -no-color
          echo "TF_VAR_zone_id=$(terraform -chdir=terraform/stacks/shared output -raw zone_id)" >> "$GITHUB_ENV"
          echo "TF_VAR_certificate_arn=$(terraform -chdir=terraform/stacks/shared output -raw certificate_arn)" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_HOMEPAGE_PLAN }}
          aws-region: eu-central-1
          unset-current-credentials: true
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: scripts/plan-stack.sh homepage
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_BLOG_PLAN }}
          aws-region: eu-central-1
          unset-current-credentials: true
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: scripts/plan-stack.sh blog
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_USES_PLAN }}
          aws-region: eu-central-1
          unset-current-credentials: true
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: scripts/plan-stack.sh uses
  shared:
    name: Deploy shared DNS and TLS
    if: >-
      !cancelled() && needs.checks.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      vars.TERRAFORM_DEPLOY_ENABLED == 'true'
    needs: [checks]
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.deploy.outputs.changed }}
      zone_id: ${{ steps.deploy.outputs.zone_id }}
      certificate_arn: ${{ steps.deploy.outputs.certificate_arn }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/apply-stack
        id: deploy
        with:
          account_id: ${{ vars.AWS_ACCOUNT_ID }}
          stack: shared
          role_arn: ${{ vars.AWS_ROLE_SHARED_APPLY }}
  homepage:
    name: Deploy homepage
    if: >-
      !cancelled() && needs.shared.result == 'success' &&
      (needs.build.outputs.homepage_changed == 'true' ||
       (github.event_name == 'push' && needs.shared.outputs.changed == 'true'))
    needs: [build, shared]
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/apply-stack
        id: deploy
        with:
          account_id: ${{ vars.AWS_ACCOUNT_ID }}
          stack: homepage
          role_arn: ${{ vars.AWS_ROLE_HOMEPAGE_APPLY }}
          zone_id: ${{ needs.shared.outputs.zone_id }}
          certificate_arn: ${{ needs.shared.outputs.certificate_arn }}
  blog:
    name: Deploy blog
    if: >-
      !cancelled() && needs.shared.result == 'success' &&
      (needs.build.outputs.blog_changed == 'true' ||
       (github.event_name == 'push' && needs.shared.outputs.changed == 'true'))
    needs: [build, shared]
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/apply-stack
        id: deploy
        with:
          account_id: ${{ vars.AWS_ACCOUNT_ID }}
          stack: blog
          role_arn: ${{ vars.AWS_ROLE_BLOG_APPLY }}
          zone_id: ${{ needs.shared.outputs.zone_id }}
          certificate_arn: ${{ needs.shared.outputs.certificate_arn }}
  uses:
    name: Deploy Uses
    if: >-
      !cancelled() && needs.shared.result == 'success' &&
      (needs.build.outputs.uses_changed == 'true' ||
       (github.event_name == 'push' && needs.shared.outputs.changed == 'true'))
    needs: [build, shared]
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/apply-stack
        id: deploy
        with:
          account_id: ${{ vars.AWS_ACCOUNT_ID }}
          stack: uses
          role_arn: ${{ vars.AWS_ROLE_USES_APPLY }}
          zone_id: ${{ needs.shared.outputs.zone_id }}
          certificate_arn: ${{ needs.shared.outputs.certificate_arn }}
