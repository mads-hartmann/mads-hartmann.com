name: Apply stack
description: Apply a stack from the current main commit using the checked site artifact.
inputs:
  stack:
    description: Terraform stack to apply
    required: true
  role_arn:
    description: AWS apply role for this stack
    required: true
  account_id:
    description: Expected AWS account
    required: true
  zone_id:
    description: Hosted zone from the shared stack
    default: ''
  certificate_arn:
    description: Certificate from the shared stack
    default: ''
outputs:
  changed:
    description: Whether the stack plan contained changes
    value: ${{ steps.deploy.outputs.changed }}
  zone_id:
    description: Hosted zone from the shared stack
    value: ${{ steps.deploy.outputs.zone_id }}
  certificate_arn:
    description: Certificate from the shared stack
    value: ${{ steps.deploy.outputs.certificate_arn }}
runs:
  using: composite
  steps:
    - name: Only deploy the current main commit
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        test "$GITHUB_REF" = refs/heads/main
        latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
        test "$GITHUB_SHA" = "$latest"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sites
    - shell: bash
      run: tar -xzf sites.tar.gz
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.16.5
        terraform_wrapper: false
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: eu-central-1
        allowed-account-ids: ${{ inputs.account_id }}
        role-session-name: sites-${{ github.run_id }}-${{ inputs.stack }}
    - name: Plan and apply this stack
      id: deploy
      env:
        STACK: ${{ inputs.stack }}
        TF_VAR_zone_id: ${{ inputs.zone_id }}
        TF_VAR_certificate_arn: ${{ inputs.certificate_arn }}
        TF_IN_AUTOMATION: 'true'
        TF_INPUT: 'false'
      shell: bash
      run: scripts/deploy-stack.sh "$STACK"
