title: Mads Hartmann
description: Mads Hartmann's Blog
url: https://blog.mads-hartmann.com
author: Mads Hartmann

# jekyll-md converts rendered article content and adds discovery links.
md:
  selector: .site
  # Recordings also have ordinary links in the article text.
  strip: [script, style, audio, iframe, "#disqus_thread", .back-to-blog]
  layout: markdown

highlighter: rouge

# Fingerprinted stylesheets do not have adjacent Sass source maps.
sass:
  sourcemap: never

collections:
  book_reviews:
    output: true

kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

disqus:
  shortname: madshartmann

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-md

# Atom feed
feed:
  posts_limit: 100

# Serving
detach: false
port: 4000
host: 0.0.0.0
baseurl: "" # does not include hostname
show_dir_listing: false
